<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermarket Checkout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f3f3f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 400px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            font-size: 16px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 5px;
            margin-top: 10px;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2980b9;
        }

        .total-price {
            text-align: center;
            font-size: 24px;
            color: #2ecc71;
            font-weight: bold;
            margin-top: 20px;
        }

        .error {
            text-align: center;
            color: red;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Supermarket Checkout</h1>
        
        <div class="input-group">
            <label for="cart">Enter Cart (e.g., AAABBD):</label>
            <input type="text" id="cart" name="cart" required>
        </div>

        <button id="checkout-button">Calculate Total</button>
        
        <div class="total-price" id="total-price">Total Price: ₹0</div>
        <div class="error" id="error-message"></div>
    </div>

    <script>
        document.getElementById("checkout-button").addEventListener("click", function(event) {
            event.preventDefault();  

            let cart = document.getElementById("cart").value.trim();

            if (cart === "") {
                document.getElementById("error-message").textContent = "Cart cannot be empty!";
                return;
            }

            document.getElementById("error-message").textContent = ""; 

            fetch("http://127.0.0.1:8000/checkout/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ cart: cart })
            })
            .then(response => response.json())
            .then(data => {
                if (data.total_price !== undefined) {
                    document.getElementById("total-price").textContent = "Total Price: ₹" + data.total_price;
                }
            })
            .catch(error => {
                console.error("Error:", error);
                document.getElementById("error-message").textContent = "An error occurred. Please try again.";
            });
        });
    </script>

</body>
</html>
